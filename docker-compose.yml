services:
    chroma:
        image: chromadb/chroma:latest
        container_name: chroma_thanos
        ports:
            - "8000:8000"
        volumes:
            - chroma-data:/chroma/chroma
        environment:
            - IS_PERSISTENT=TRUE
            - ANONYMIZED_TELEMETRY=FALSE
    
    mongodb:
        image: mongo:latest
        container_name: mongodb_thanos
        ports:
        - "27017:27017"
        volumes:
        - mongodb-data:/data/db
        environment:
        - MONGO_INITDB_ROOT_USERNAME=thanos
        - MONGO_INITDB_ROOT_PASSWORD=thanos

volumes:
    chroma-data:
    mongodb-data:
