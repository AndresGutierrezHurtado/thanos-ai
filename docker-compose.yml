services:
    chroma:
        image: chromadb/chroma:latest
        container_name: chroma_thanos
        ports:
            - "8000:8000"
        volumes:
            - chroma-data:/chroma/chroma
        environment:
            - IS_PERSISTENT=TRUE
            - ANONYMIZED_TELEMETRY=FALSE

    mongodb:
        image: mongo:latest
        container_name: mongodb_thanos
        ports:
            - "27017:27017"
        volumes:
            - mongodb-data:/data/db
        environment:
            - MONGO_INITDB_ROOT_USERNAME=thanos
            - MONGO_INITDB_ROOT_PASSWORD=thanos

    app:
        build: .
        container_name: app_thanos
        env_file: .env
        ports:
            - "3000:3000"
        environment:
            # Inside the compose network the services are reached by name
            - NODE_ENV=production
            - PORT=3000
            - MONGODB_URI=mongodb://thanos:thanos@mongodb:27017
            - CHROMA_URL=http://chroma:8000
        depends_on:
            - mongodb
            - chroma

volumes:
    chroma-data:
    mongodb-data:
