# Production stack: `docker-compose up -d --build`
# Everything is configured from the single root .env file.
# Format 2.3 keeps it compatible with old docker-compose (>= 1.16) and with Compose v2.
version: "2.3"

services:
    mongodb:
        image: mongo:9.0
        container_name: mongodb_thanos
        restart: unless-stopped
        # Bound to localhost only: reachable for `npm run dev` on the host, never from outside
        ports:
            - "127.0.0.1:27017:27017"
        volumes:
            - mongodb-data:/data/db
        environment:
            # Only applied the first time the volume is initialised
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

    chroma:
        image: chromadb/chroma:1.5.9
        container_name: chroma_thanos
        restart: unless-stopped
        ports:
            - "127.0.0.1:${CHROMA_HOST_PORT:-8000}:8000"
        volumes:
            # Chroma >= 1.0 persists in /data
            - chroma-data:/data
        environment:
            ANONYMIZED_TELEMETRY: "FALSE"
        healthcheck:
            test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 10s

    app:
        build: .
        image: thanos-ai-app
        container_name: app_thanos
        restart: unless-stopped
        init: true
        ports:
            - "${PORT:-3000}:3000"
        environment:
            # Overrides for values in .env that differ inside the compose network.
            # Real env vars take precedence over the mounted .env (node --env-file).
            NODE_ENV: production
            PORT: 3000
            MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017
            CHROMA_URL: http://chroma:8000
        volumes:
            # Single .env, read by the app and the CLI scripts (tsx --env-file=../.env).
            # Mounted, not baked into the image; Node parses quotes/comments correctly.
            - ./.env:/app/.env:ro
            - media-data:/app/server/public/media
            - logs-data:/app/server/logs
            # Documents uploaded from the app
            - uploads-data:/app/server/uploads
        depends_on:
            mongodb:
                condition: service_healthy
            chroma:
                condition: service_healthy

volumes:
    chroma-data:
    mongodb-data:
    media-data:
    logs-data:
    uploads-data:
